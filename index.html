<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benji$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--fg:#f2efec;--muted:#8a8782;--dim:#57534e;--line:#1c1c1c;--line2:#2c2c2c;--panel:#0f0f0f;--accent:#F93A2F}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:'Archivo',sans-serif;color:var(--fg);letter-spacing:.01em;overflow-x:hidden;min-height:100vh}
a{color:var(--fg);text-decoration:none}
a:hover{color:var(--accent)}
img{max-width:100%;display:block}
button{font:inherit}
::selection{background:var(--accent);color:var(--bg)}

@keyframes bIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ---------- overlays ---------- */
.loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .55s ease;pointer-events:none}
.loader.is-fading{opacity:0}
.loader.is-done{display:none}
.loader img{height:180px;animation:bIn .7s cubic-bezier(.2,.8,.2,1) both}
.page-transition{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .32s ease}
.page-transition.is-active{opacity:1}
.page-transition img{height:110px}

/* ---------- marquee ---------- */
.marquee{background:var(--accent);overflow:hidden;height:34px;position:relative;z-index:1;box-shadow:0 0 18px var(--accent),0 0 40px var(--accent),inset 0 0 14px rgba(255,255,255,.15)}
.marquee-track{display:flex;align-items:center;height:100%;white-space:nowrap;will-change:transform}
.marquee-content{display:inline-flex;gap:44px;padding:0 22px;font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.9),0 0 18px var(--accent),0 0 40px var(--accent)}
.marquee-content span.sep{opacity:.5}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:80;background:rgba(11,11,11,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.header-mobile{padding:20px 18px}
.header-desktop{display:none;padding:18px 40px}
.hamburger-btn{font-size:28px;line-height:1;padding:4px;background:none;border:none;color:var(--fg);cursor:pointer}
.logo-btn{background:none;border:none;padding:0;cursor:pointer;line-height:0}
.logo-btn img{height:36px}
.bag-link{font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
.nav-desktop{display:flex;gap:36px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.header-actions{display:flex;gap:26px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;align-items:center}
.header-actions .bag-link{font-size:12px}

.mobile-menu-overlay{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.7);display:none}
.mobile-menu-overlay.is-open{display:block}
.mobile-menu{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:86;background:var(--panel);padding:70px 28px 40px;display:none;flex-direction:column;gap:32px;font-size:14px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;animation:fadeUp .25s ease both}
.mobile-menu.is-open{display:flex}
.mobile-menu-close{position:absolute;top:18px;right:18px;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer}
.mobile-menu-social{border-top:1px solid var(--line);padding-top:28px;display:flex;flex-direction:column;gap:22px;font-size:12px;color:var(--muted)}

@media (min-width:769px){
  .header-mobile{display:none}
  .header-desktop{display:flex}
}

/* ---------- hero ---------- */
.hero-section{height:140vh;position:relative;z-index:1;background:var(--bg)}
.hero-sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:#080808}
.hero-photo{position:absolute;z-index:1;top:2%;will-change:transform;overflow:hidden;opacity:0}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo-0{left:10%;top:2%;width:8vw;height:92vh}
.hero-photo-0 img{object-position:center 20%}
.hero-photo-1{left:38%;top:5%;width:7vw;height:80vh}
.hero-photo-1 img{object-position:center center}
.hero-photo-2{left:66%;top:3%;width:6vw;height:86vh}
.hero-photo-2 img{object-position:center 15%}
.hero-photo-3{left:88%;top:6%;width:10vw;height:78vh}
.hero-photo-3 img{object-position:center 20%}
@media (max-width:768px){
  .hero-photo-0{left:5%;width:16vw}
  .hero-photo-1{left:28%;width:14vw}
  .hero-photo-2{left:52%;width:12vw}
  .hero-photo-3{left:76%;width:20vw}
}
.hero-letters{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:flex-start;gap:1.6vw;pointer-events:none}
@media (max-width:768px){.hero-letters{gap:1vw}}
.hero-letter{position:relative;overflow:hidden;flex-shrink:0;will-change:transform}
.hero-letter img{position:absolute;top:0;height:100%;max-width:none}
.hero-letter-0{width:11vw;aspect-ratio:276/773}
.hero-letter-0 img{left:-10.87%;width:509.06%}
.hero-letter-1{width:12.2vw;aspect-ratio:305/773}
.hero-letter-1 img{left:-103.93%;width:460.66%}
.hero-letter-2{width:11.2vw;aspect-ratio:282/773}
.hero-letter-2 img{left:-232.27%;width:498.23%}
.hero-letter-3{width:3.8vw;aspect-ratio:93/773}
.hero-letter-3 img{left:-1019.35%;width:1510.75%}
.hero-letter-4{width:3.4vw;aspect-ratio:85/773}
.hero-letter-4 img{left:-1270.59%;width:1652.94%}
.hero-letter-5{width:6.6vw;aspect-ratio:165/773}
.hero-letter-5 img{left:-733.33%;width:851.52%}
@media (max-width:768px){
  .hero-letter-0{width:18.3vw} .hero-letter-1{width:20.2vw} .hero-letter-2{width:18.7vw}
  .hero-letter-3{width:6.2vw} .hero-letter-4{width:5.6vw} .hero-letter-5{width:10.9vw}
}
.hero-scroll-ind{position:absolute;z-index:3;left:50%;bottom:4%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;will-change:opacity}
.hero-scroll-ind .line{width:1px;height:36px;background:linear-gradient(180deg,transparent,#3a3a3a)}
.hero-scroll-ind span{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.36em;color:#3a3a3a;text-transform:uppercase}
.hero-cta{position:absolute;z-index:3;right:40px;bottom:4.5%;opacity:0;will-change:opacity;display:flex;align-items:center;gap:14px}
.hero-cta span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.3em;color:#3a3a3a;text-transform:uppercase}
.hero-cta a{font-size:11px;letter-spacing:.3em;color:var(--fg)}
.hero-cta a:hover{color:var(--accent)}
.hero-grain{position:absolute;inset:0;pointer-events:none;opacity:.04}

/* ---------- drop 01 ---------- */
.drop-section{padding:110px 40px 90px;position:relative;z-index:1;background:var(--bg)}
@media (max-width:768px){.drop-section{padding:60px 16px 60px}}
.drop-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:44px}
@media (max-width:768px){.drop-header{margin-bottom:28px}}
.drop-header h2{margin:0;font-family:'Anton',sans-serif;font-size:56px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
@media (max-width:768px){.drop-header h2{font-size:36px}}
.drop-header a{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.drop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:768px){.drop-grid{grid-template-columns:repeat(2,1fr);gap:16px}}
.product-card{cursor:pointer;display:flex;flex-direction:column;gap:14px;background:none;border:none;padding:0;text-align:left;color:inherit;font:inherit}
.media-box{aspect-ratio:3/4;background:repeating-linear-gradient(45deg,#141414 0 12px,#0f0f0f 12px 24px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.product-card .media-box{transition:transform .35s ease}
.product-card:hover .media-box{transform:translateY(-4px)}
.media-box img{width:100%;height:100%;object-fit:cover}
.placeholder-text{font-family:ui-monospace,monospace;font-size:11px;color:#57534e;padding:0 8px;text-align:center}
.card-tag{position:absolute;top:14px;left:14px;font-size:10px;font-weight:600;letter-spacing:.2em;padding:5px 10px;background:var(--accent);color:var(--bg)}
.card-info{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.card-info span:last-child{color:var(--muted)}

/* ---------- gallery ---------- */
.gallery-fixed-img{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;object-position:center 20%;z-index:0}
.gallery-spacer{position:relative;height:100vh;z-index:1;background:transparent;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.gallery-scrim{position:absolute;inset:0;background:rgba(8,8,8,.4)}
.gallery-text{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
.gallery-text .brand{font-family:'Anton',sans-serif;font-size:80px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--fg);text-shadow:0 2px 30px rgba(0,0,0,.6)}
.gallery-text .sub{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:rgba(242,239,236,.5)}
@media (max-width:768px){
  .gallery-text .brand{font-size:42px}
  .gallery-text .sub{font-size:9px}
}

/* ---------- unicos ---------- */
.unicos-section{padding:100px 40px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative;z-index:1;background:var(--bg)}
@media (max-width:768px){.unicos-section{padding:60px 16px;grid-template-columns:1fr;gap:32px}}
.unicos-copy{display:flex;flex-direction:column;gap:24px}
.unicos-copy h2{margin:0;font-family:'Anton',sans-serif;font-size:72px;font-weight:400;line-height:.95;text-transform:uppercase}
@media (max-width:768px){.unicos-copy h2{font-size:48px}}
.unicos-copy h2 span{color:var(--accent)}
.unicos-copy p{margin:0;max-width:38ch;color:var(--muted);font-size:15px;line-height:1.7}
.unicos-copy a{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;border-bottom:1px solid var(--accent);padding-bottom:6px}
.unicos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.unicos-grid .media-box:nth-child(2){margin-top:44px}

/* ---------- cta ---------- */
.cta-section{padding:130px 40px;border-top:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;position:relative;z-index:1;background:var(--bg)}
@media (max-width:768px){.cta-section{padding:70px 16px}}
.cta-section h2{margin:0;font-family:'Anton',sans-serif;font-size:64px;font-weight:400;text-transform:uppercase}
@media (max-width:768px){.cta-section h2{font-size:40px}}
.cta-section p{margin:0;color:var(--muted);font-size:15px;max-width:44ch;line-height:1.7}
.btn-outline{border:1px solid var(--accent);color:var(--accent);padding:14px 34px;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;background:none}
.btn-outline:hover{background:var(--accent);color:var(--bg)}

/* ---------- shop ---------- */
.shop-main{padding:70px 40px 100px}
@media (max-width:768px){.shop-main{padding:40px 16px 60px}}
.shop-main h1{margin:0 0 40px;font-family:'Anton',sans-serif;font-size:88px;font-weight:400;text-transform:uppercase;line-height:1}
@media (max-width:768px){.shop-main h1{font-size:48px;margin-bottom:24px}}
.shop-cats{display:flex;gap:28px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:44px;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:768px){.shop-cats{gap:16px;font-size:10px;padding-bottom:14px;margin-bottom:28px}}
.shop-cats a{padding-bottom:6px;white-space:nowrap;border-bottom:2px solid transparent}
.shop-carousel{height:66vh;position:relative;overflow:hidden;margin:0 -40px}
@media (max-width:768px){.shop-carousel{height:52vh;margin:0 -16px}}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(11,11,11,.55);border:1px solid var(--line2);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:2;backdrop-filter:blur(4px)}
.carousel-nav:hover{border-color:var(--accent);color:var(--accent)}
.carousel-nav:disabled{opacity:.3;cursor:default;pointer-events:none}
.carousel-nav.prev{left:16px}
.carousel-nav.next{right:16px}
.carousel-track{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:26px;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.carousel-item{flex-shrink:0;cursor:pointer;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,#161616 0 12px,#101010 12px 24px);display:flex;align-items:center;justify-content:center;position:relative;transition:height .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1),opacity .55s ease}
.carousel-item img{width:100%;height:100%;object-fit:cover}
.shop-selected{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:40px}
.shop-selected .name{font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.shop-selected .name .price{color:var(--muted)}
.shop-selected a{font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;border-bottom:1px solid var(--accent);padding-bottom:6px}

/* ---------- product ---------- */
.product-main{display:grid;grid-template-columns:1.25fr 1fr;gap:0;min-height:88vh}
@media (max-width:768px){.product-main{grid-template-columns:1fr;min-height:auto}}
.product-gallery{display:flex;flex-direction:column;gap:2px}
.product-info-panel{padding:70px 56px;position:sticky;top:60px;align-self:flex-start;display:flex;flex-direction:column;gap:26px}
@media (max-width:768px){.product-info-panel{padding:28px 16px 60px;position:relative;top:0}}
.product-info-panel .back{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.product-info-panel h1{margin:0;font-family:'Anton',sans-serif;font-size:44px;font-weight:400;text-transform:uppercase;line-height:1.05}
.product-price{font-size:22px;letter-spacing:.06em;font-weight:500}
.product-desc{margin:0;color:var(--muted);font-size:14px;line-height:1.75;max-width:42ch}
.product-origin{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.buy-box{border-top:1px solid var(--line);padding-top:22px;display:flex;flex-direction:column;gap:18px}
.field-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.field-group{display:flex;flex-direction:column;gap:10px}
.color-swatches{display:flex;gap:10px}
.color-swatches span{width:26px;height:26px;cursor:pointer;border:1px solid var(--line2)}
.size-required{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.size-grid{display:flex;gap:10px}
.size-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:none;color:var(--fg);font-size:12px;font-weight:600;letter-spacing:.14em;transition:all .2s ease;cursor:pointer}
.size-btn:hover{border-color:var(--fg)}
.size-btn.is-selected{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.qty-control{display:flex;align-items:center;gap:0;border:1px solid var(--line2);align-self:flex-start}
.qty-control button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);background:none;border:none;cursor:pointer}
.qty-control button:hover{color:var(--fg)}
.qty-control span{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;letter-spacing:.1em;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.add-to-cart-row{display:flex;gap:12px;align-items:stretch;margin-top:6px}
.btn-solid{flex:1;text-align:center;background:var(--fg);color:var(--bg);padding:16px 0;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;border:none;cursor:pointer;font-family:'Archivo',sans-serif}
.btn-solid:hover{background:var(--accent);color:var(--bg)}
.wish-btn{border:1px solid var(--line2);display:flex;align-items:center;padding:0 18px}
.wish-btn:hover{border-color:var(--accent);color:var(--accent)}
.coming-soon-box{border:1px solid var(--line2);padding:16px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.accordion{border-top:1px solid var(--line);padding-top:4px;display:flex;flex-direction:column;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.accordion-row{border-bottom:1px solid var(--line)}
.accordion-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0;color:var(--muted);background:none;border:none;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
.accordion-toggle:hover{color:var(--fg)}
.accordion-content{margin:0 0 18px;color:var(--muted);font-size:13px;letter-spacing:.02em;text-transform:none;line-height:1.7;display:none}
.accordion-row.is-open .accordion-content{display:block}
.whatsapp-link{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* ---------- custom / checkout ---------- */
.split-main{padding:70px 40px 110px;display:grid;grid-template-columns:1fr 1fr;gap:70px}
@media (max-width:768px){.split-main{padding:40px 16px 70px;grid-template-columns:1fr;gap:40px}}
.split-main .copy{display:flex;flex-direction:column;gap:28px}
.split-main .copy h1{margin:0;font-family:'Anton',sans-serif;font-size:96px;font-weight:400;text-transform:uppercase;line-height:.95}
@media (max-width:768px){.split-main .copy h1{font-size:52px}}
.split-main .copy p{margin:0;color:var(--muted);font-size:15px;line-height:1.75;max-width:42ch}
.custom-shot{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#141414 0 12px,#0f0f0f 12px 24px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.form-col{display:flex;flex-direction:column;gap:26px;padding-top:14px}
.form-field{display:flex;flex-direction:column;gap:10px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.form-field input,.form-field textarea{background:transparent;border:none;border-bottom:1px solid var(--line2);color:var(--fg);font-family:'Archivo',sans-serif;font-size:15px;padding:8px 0;outline:none;letter-spacing:.02em}
.form-field textarea{resize:vertical}
.file-drop{border:1px dashed var(--line2);padding:26px;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.form-error{color:var(--accent);font-size:12px;letter-spacing:.06em;line-height:1.5;display:block}
.checkout-summary{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:22px}
.checkout-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.checkout-line .name-col{display:flex;flex-direction:column;gap:2px}
.checkout-line .size-note{color:var(--dim);font-size:10px}
.checkout-line .total-col{color:var(--muted);white-space:nowrap}
.checkout-total{display:flex;justify-content:space-between;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:16px}

/* ---------- order status ---------- */
.order-status-main{padding:130px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
@media (max-width:768px){.order-status-main{padding:70px 16px}}
.order-status-main h1{margin:0;font-family:'Anton',sans-serif;font-size:64px;font-weight:400;text-transform:uppercase}
@media (max-width:768px){.order-status-main h1{font-size:40px}}
.order-status-main p{margin:0;color:var(--muted);font-size:15px;max-width:44ch;line-height:1.7}
.order-ref{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

/* ---------- about ---------- */
.about-main{padding:90px 40px 110px;display:flex;flex-direction:column;gap:100px;max-width:1100px;margin:0 auto}
@media (max-width:768px){.about-main{padding:50px 16px 70px;gap:50px}}
.about-hero{display:flex;flex-direction:column;gap:34px;align-items:center;text-align:center}
@media (max-width:768px){.about-hero{gap:22px}}
.about-hero img{height:130px}

<script>
'use strict';

/* ==================== helpers ==================== */
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function formatPrice(n) {
  if (n === null || n === undefined) return null;
  return '$ ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function isMobile() { return window.innerWidth < 768; }

/* ==================== default content (fallback until CMS loads) ==================== */
function defaultProducts() {
  const cs = 'COMING SOON';
  return [
    { name: 'BALACLAVA 01', price: null, cat: 'BALACLAVAS', status: 'published', sizes: ['S','M','L'], desc: 'Balaclava de punto grueso con terminaciones a mano. Abrigo y estilo en una sola pieza.' },
    { name: 'BALACLAVA 02', price: null, cat: 'BALACLAVAS', status: 'published', sizes: ['M','L','XL'], desc: 'Balaclava de algodón liviano, ideal para entretiempo. Corte relajado.' },
    { name: 'BALACLAVA 03', price: null, cat: 'BALACLAVAS', status: 'published', sizes: ['S','M','L','XL'], desc: 'Balaclava oversize de frisa rústica. Doble capa en la zona del cuello.' },
    { name: 'BALACLAVA 04', price: null, cat: 'BALACLAVAS', status: 'coming', tag: cs, sizes: [] },
    { name: 'BALACLAVA 05', price: null, cat: 'BALACLAVAS', status: 'coming', tag: cs, sizes: [] },
    { name: 'BALACLAVA 06', price: null, cat: 'BALACLAVAS', status: 'coming', tag: cs, sizes: [] },
    { name: 'RIÑONERA 01', price: null, cat: 'RIÑONERAS', status: 'published', unique: true, tag: '1/1', sizes: ['ÚNICA'], desc: 'Riñonera hecha con materiales recuperados. Pieza única e irrepetible.' },
    { name: 'RIÑONERA 02', price: null, cat: 'RIÑONERAS', status: 'published', unique: true, tag: '1/1', sizes: ['ÚNICA'], desc: 'Riñonera artesanal con cierre YKK y correa ajustable. Pieza 1/1.' },
    { name: 'RIÑONERA 03', price: null, cat: 'RIÑONERAS', status: 'sold', unique: true, tag: 'SOLD OUT', sizes: [], desc: '' },
    { name: 'BUZO 01', price: null, cat: 'BUZOS', status: 'coming', tag: cs, sizes: [], desc: 'Buzo oversize de frisa rústica con capucha y bolsillos asimétricos.' },
    { name: 'BUZO 02', price: null, cat: 'BUZOS', status: 'coming', tag: cs, sizes: [], desc: 'Buzo liviano con estampa serigráfica y corte boxy.' }
  ];
}
function defaultArchives() {
  return [
    { title: 'STREET SESH 01', credit: 'Fotos @fotógrafo — Marzo, 2025', wide: false, desc: 'Primera sesión callejera de Benji$. Montevideo de noche, prendas en su hábitat natural.', text: 'La primera salida a la calle con las piezas terminadas. Sin producción, sin luces artificiales. Solo la ciudad y la ropa.', photos: ['STREET 01 — FOTO 1','STREET 01 — FOTO 2','STREET 01 — FOTO 3','STREET 01 — FOTO 4','STREET 01 — FOTO 5','STREET 01 — FOTO 6'].map(l => ({ label: l, url: null })) },
    { title: 'STREET SESH 02', credit: 'Fotos @fotógrafo — Mayo, 2025', wide: false, desc: 'Segunda sesión. Ciudad Vieja, atardecer, balaclavas y riñoneras.', text: '', photos: ['STREET 02 — FOTO 1','STREET 02 — FOTO 2','STREET 02 — FOTO 3','STREET 02 — FOTO 4','STREET 02 — FOTO 5'].map(l => ({ label: l, url: null })) },
    { title: 'LOOKBOOK DROP 01', credit: 'Fotos @fotógrafo — Junio, 2025', wide: true, desc: 'Lookbook completo del primer drop. Todas las piezas, todos los ángulos.', text: 'Cada prenda fotografiada en contexto. Sin fondo blanco, sin maniquí. Así se usan.', photos: ['LOOKBOOK — FOTO 1','LOOKBOOK — FOTO 2','LOOKBOOK — FOTO 3','LOOKBOOK — FOTO 4','LOOKBOOK — FOTO 5','LOOKBOOK — FOTO 6','LOOKBOOK — FOTO 7','LOOKBOOK — FOTO 8'].map(l => ({ label: l, url: null })) },
    { title: 'DETRÁS DE ESCENA', credit: 'Benji$ — 2025', wide: false, desc: 'El proceso. El taller. Las manos detrás de cada pieza.', text: '', photos: ['BTS — FOTO 1','BTS — FOTO 2','BTS — FOTO 3','BTS — FOTO 4'].map(l => ({ label: l, url: null })) },
    { title: 'STREET SESH 03', credit: 'Fotos @fotógrafo — Julio, 2025', wide: false, desc: 'Tercera sesión. Rambla, mediodía, sol directo.', text: '', photos: ['STREET 03 — FOTO 1','STREET 03 — FOTO 2','STREET 03 — FOTO 3','STREET 03 — FOTO 4','STREET 03 — FOTO 5'].map(l => ({ label: l, url: null })) },
    { title: 'DESFILE BENJI$', credit: 'Fotos @fotógrafo — Agosto, 2025', wide: true, desc: 'Primer desfile de Benji$. Todas las piezas en movimiento.', text: 'La primera vez que las piezas se vieron en pasarela. Un espacio industrial en el Cerro, música en vivo, 15 modelos.', photos: ['DESFILE — FOTO 1','DESFILE — FOTO 2','DESFILE — FOTO 3','DESFILE — FOTO 4','DESFILE — FOTO 5','DESFILE — FOTO 6','DESFILE — FOTO 7'].map(l => ({ label: l, url: null })) }
  ];
}

/* ==================== state ==================== */
const cms = { settings: null, categories: null, customFields: null, products: null, archives: null };
const state = {
  page: 'home',
  cart: [],
  cartOpen: false,
  menuOpen: false,
  cat: 'ALL',
  shopIdx: 0,
  prodIdx: 0,
  archIdx: 0,
  selSize: null,
  qty: 1,
  accOpen: null,
  checkoutSubmitting: false,
  checkoutError: '',
  orderStatus: null,
  orderRef: ''
};
try {
  const savedCart = JSON.parse(localStorage.getItem('benjis_cart') || '[]');
  if (Array.isArray(savedCart)) state.cart = savedCart;
} catch (e) {}

function accent() { return (cms.settings && cms.settings.accent_color) || '#F93A2F'; }
function settingsVal(key, fallback) { return (cms.settings && cms.settings[key]) || fallback; }
function allProducts() { return cms.products || defaultProducts(); }
function allArchives() { return cms.archives || defaultArchives(); }

function decorate(p, all) {
  const price = p.price != null ? formatPrice(p.price) : (p.status === 'coming' ? '' : '$ X.XXX');
  return {
    raw: p,
    id: p.id, name: p.name, price, tag: p.tag || '', desc: p.desc || '',
    materials: p.materials || '', shippingReturns: p.shippingReturns || '',
    placeholder: 'FOTO ' + p.name,
    image1: (p.images && p.images[0]) || '', image2: (p.images && p.images[1]) || '',
    sizes: p.sizes || [], status: p.status,
    idx: all.indexOf(p)
  };
}

function saveCart() {
  try { localStorage.setItem('benjis_cart', JSON.stringify(state.cart)); } catch (e) {}
}
function cartCount() { return state.cart.reduce((n, it) => n + it.qty, 0); }
function cartSubtotal() { return formatPrice(state.cart.reduce((sum, it) => sum + (it.price || 0) * it.qty, 0)) || '$ 0'; }

/* ==================== navigation ==================== */
let transTimer1, transTimer2;
function goTo(page, extra) {
  if (state.page === page && !extra) return;
  document.getElementById('page-transition').classList.add('is-active');
  clearTimeout(transTimer1); clearTimeout(transTimer2);
  transTimer1 = setTimeout(() => {
    state.page = page;
    state.selSize = null;
    state.qty = 1;
    state.accOpen = null;
    Object.assign(state, extra || {});
    renderPage();
    updateHeader();
    window.scrollTo(0, 0);
  }, 340);
  transTimer2 = setTimeout(() => {
    document.getElementById('page-transition').classList.remove('is-active');
  }, 720);
}

/* ==================== media box helper ==================== */
function mediaBox(url, alt, placeholder, extraAttrs) {
  extraAttrs = extraAttrs || '';
  if (url) return `<div class="media-box" ${extraAttrs}><img src="${esc(url)}" alt="${esc(alt)}"></div>`;
  return `<div class="media-box" ${extraAttrs}><span class="placeholder-text">[ ${esc(placeholder)} ]</span></div>`;
}

/* ==================== header ==================== */
function updateHeader() {
  const count = String(cartCount());
  document.querySelectorAll('.cart-count').forEach(el => { el.textContent = count; });
  const navMap = {
    shop: state.page === 'shop' || state.page === 'product',
    archive: state.page === 'archive' || state.page === 'archiveDetail',
    custom: state.page === 'custom',
    about: state.page === 'about'
  };
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.style.color = navMap[el.getAttribute('data-nav')] ? accent() : '';
  });
}

/* ==================== cart drawer ==================== */
function renderCartDrawer() {
  const body = document.getElementById('cart-body');
  if (state.cart.length === 0) {
    body.innerHTML = `<p class="cart-empty">Todavía no agregaste nada</p>`;
    return;
  }
  const items = state.cart.map((it, i) => `
    <div class="cart-item">
      <div class="thumb"></div>
      <div class="info">
        <span>${esc(it.name)}</span>
        ${it.size ? `<span class="size">Talle ${esc(it.size)}</span>` : ''}
        <span class="price">${esc(it.price != null ? formatPrice(it.price) : '$ X.XXX')}</span>
        <div class="qty-control">
          <button data-action="cartDec" data-i="${i}">−</button>
          <span>${it.qty}</span>
          <button data-action="cartInc" data-i="${i}">+</button>
        </div>
      </div>
      <button class="remove" data-action="cartRemove" data-i="${i}">✕</button>
    </div>
  `).join('');
  body.innerHTML = `
    <div class="cart-items">${items}</div>
    <div class="cart-footer">
      <div class="cart-subtotal"><span>Subtotal</span><span>${cartSubtotal()}</span></div>
      <span class="cart-shipping-note">Envíos calculados al final</span>
      <a href="#" class="btn-solid" data-action="goCheckout">Finalizar compra</a>
    </div>
  `;
}
function openCart() { state.cartOpen = true; renderCartDrawer(); syncCartDrawer(); }
function closeCart() { state.cartOpen = false; syncCartDrawer(); }
function syncCartDrawer() {
  document.getElementById('cart-overlay').classList.toggle('is-open', state.cartOpen);
  document.getElementById('cart-drawer').classList.toggle('is-open', state.cartOpen);
}
function addToCart(prod) {
  const existingIdx = state.cart.findIndex(it => it.productId === prod.id && it.size === state.selSize);
  if (existingIdx >= 0) {
    state.cart[existingIdx].qty += state.qty;
  } else {
    state.cart.push({ productId: prod.id, name: prod.name, price: prod.raw.price, size: state.selSize, qty: state.qty });
  }
  saveCart();
  state.qty = 1;
  updateHeader();
  openCart();
}
function mutateCartQty(i, delta) {
  const it = state.cart[i];
  if (!it) return;
  it.qty = Math.max(1, it.qty + delta);
  saveCart();
  updateHeader();
  renderCartDrawer();
}
function removeCartItem(i) {
  state.cart.splice(i, 1);
  saveCart();
  updateHeader();
  renderCartDrawer();
}

/* ==================== page renderers ==================== */
const PAGE_CLASS = {
  home: '', shop: 'shop-main', product: 'product-main',
  custom: 'split-main', checkout: 'split-main', orderStatus: 'order-status-main',
  about: 'about-main', archive: 'archive-main', archiveDetail: 'archive-detail-main'
};
function renderPage() {
  const el = document.getElementById('page');
  el.className = PAGE_CLASS[state.page] || '';
  switch (state.page) {
    case 'home': el.innerHTML = renderHome(); afterHomeRender(); break;
    case 'shop': el.innerHTML = renderShop(); afterShopRender(); break;
    case 'product': el.innerHTML = renderProduct(); afterProductRender(); break;
    case 'custom': el.innerHTML = renderCustom(); afterCustomRender(); break;
    case 'checkout': el.innerHTML = renderCheckout(); afterCheckoutRender(); break;
    case 'orderStatus': el.innerHTML = renderOrderStatus(); break;
    case 'about': el.innerHTML = renderAbout(); break;
    case 'archive': el.innerHTML = renderArchive(); break;
    case 'archiveDetail': el.innerHTML = renderArchiveDetail(); break;
  }
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

/* ---- home ---- */
function renderHome() {
  const all = allProducts();
  const featured = (all.filter(p => p.featured).length ? all.filter(p => p.featured) : [all[0], all[1], all[6]].filter(Boolean)).slice(0, 3).map(p => decorate(p, all));

const CAROUSEL = { GAP: 26, SW: 230, LW: 440, mSW: 160, mLW: 280 };
function shopFiltered() {
  const all = allProducts();
  if (state.cat === 'ALL') return all;
  if (state.cat === 'ÚNICOS') return all.filter(p => p.unique);
  return all.filter(p => p.cat === state.cat);
}
function renderShop() {
  const all = allProducts();
  const filtered = shopFiltered();
  const idx = Math.min(state.shopIdx || 0, Math.max(0, filtered.length - 1));
  state.shopIdx = idx;
  const catNames = ['ALL', ...(cms.categories || ['BUZOS', 'BALACLAVAS', 'RIÑONERAS']), 'ÚNICOS'];
  const cats = catNames.map(c => `<a href="#" data-action="pickCat" data-cat="${esc(c)}" style="color:${state.cat === c ? 'var(--fg)' : 'var(--muted)'};border-color:${state.cat === c ? accent() : 'transparent'}">${esc(c)}</a>`).join('');
  const items = filtered.map((p, i) => shopItemHtml(p, i, i === idx, all)).join('');
  const sel = filtered[idx];
  const selDeco = sel ? decorate(sel, all) : null;
  return `
    <h1>${esc(state.cat === 'ALL' ? 'Shop' : state.cat.toLowerCase())}</h1>
    <div class="shop-cats" id="shop-cats">${cats}</div>
    <div class="shop-carousel">
      <button class="carousel-nav prev" data-action="shopPrev" aria-label="Producto anterior" ${idx <= 0 ? 'disabled' : ''}>←</button>
      <div class="carousel-track" id="carousel-track">${items}</div>
      <button class="carousel-nav next" data-action="shopNext" aria-label="Producto siguiente" ${idx >= filtered.length - 1 ? 'disabled' : ''}>→</button>
    </div>
    <div class="shop-selected" id="shop-selected">
      ${selDeco ? `<span class="name">${esc(selDeco.name)} <span class="price">— ${esc(selDeco.price)}</span></span>
      <a href="#" data-action="openProduct" data-idx="${selDeco.idx}">Ver pieza →</a>` : ''}
    </div>
  `;
}
function shopItemHtml(p, i, sel, all) {
  const d = decorate(p, all);
  const m = isMobile();
  const h = sel ? (m ? '50vh' : '62vh') : (m ? '34vh' : '42vh');
  const w = (sel ? (m ? CAROUSEL.mLW : CAROUSEL.LW) : (m ? CAROUSEL.mSW : CAROUSEL.SW)) + 'px';
  const o = p.status === 'sold' ? (sel ? '.7' : '.3') : (sel ? '1' : '.5');
  const tagBg = d.tag === '1/1' ? accent() : 'var(--bg)';
  const tagColor = d.tag === '1/1' ? 'var(--bg)' : 'var(--muted)';
  const tagBorder = d.tag === '1/1' ? accent() : 'var(--line2)';
  return `
    <div class="carousel-item" data-action="pickCarouselItem" data-i="${i}" style="height:${h};width:${w};opacity:${o}">
      ${d.image1 ? `<img src="${esc(d.image1)}" alt="${esc(d.name)}">` : `<span class="placeholder-text">[ ${esc(d.placeholder)} ]</span>`}
      ${d.tag ? `<span class="card-tag" style="background:${tagBg};color:${tagColor};border:1px solid ${tagBorder}">${esc(d.tag)}</span>` : ''}
    </div>
  `;
}
function carouselTx(idx) {
  const m = isMobile();
  return m
    ? -(idx * (CAROUSEL.mSW + CAROUSEL.GAP) + CAROUSEL.mLW / 2)
    : -(idx * (CAROUSEL.SW + CAROUSEL.GAP) + CAROUSEL.LW / 2);
}
function afterShopRender() {
  const track = document.getElementById('carousel-track');
  if (track) track.style.transform = `translate(${carouselTx(state.shopIdx)}px,-50%)`;
}
function updateShopSelection() {
  const all = allProducts();
  const filtered = shopFiltered();
  const idx = state.shopIdx;
  const track = document.getElementById('carousel-track');
  if (!track) return;
  Array.from(track.children).forEach((child, i) => {
    const p = filtered[i];
    if (!p) return;
    const sel = i === idx;
    const m = isMobile();
    child.style.height = sel ? (m ? '50vh' : '62vh') : (m ? '34vh' : '42vh');
    child.style.width = (sel ? (m ? CAROUSEL.mLW : CAROUSEL.LW) : (m ? CAROUSEL.mSW : CAROUSEL.SW)) + 'px';
    child.style.opacity = p.status === 'sold' ? (sel ? '.7' : '.3') : (sel ? '1' : '.5');
  });
  track.style.transform = `translate(${carouselTx(idx)}px,-50%)`;
  const sel = filtered[idx];
  const selBox = document.getElementById('shop-selected');
  if (selBox) {
    if (sel) {
      const d = decorate(sel, all);
      selBox.innerHTML = `<span class="name">${esc(d.name)} <span class="price">— ${esc(d.price)}</span></span><a href="#" data-action="openProduct" data-idx="${d.idx}">Ver pieza →</a>`;
    } else {
      selBox.innerHTML = '';
    }
  }
  const prevBtn = document.querySelector('.carousel-nav.prev');
  const nextBtn = document.querySelector('.carousel-nav.next');
  if (prevBtn) prevBtn.disabled = idx <= 0;
  if (nextBtn) nextBtn.disabled = idx >= filtered.length - 1;
}

function onSubmitCustomForm(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const parts = [];
  form.querySelectorAll('label').forEach(label => {
    const field = label.querySelector('input, textarea');
    if (!field) return;
    const clone = label.cloneNode(true);
    const fieldClone = clone.querySelector('input, textarea');
    if (fieldClone) fieldClone.remove();
    const labelText = clone.textContent.trim();
    const val = (field.value || '').toString().trim();
    if (val) parts.push(labelText + ': ' + val);
  });
  const msg = parts.length ? 'Hola! Quiero hacer una consulta de custom.\n\n' + parts.join('\n') : 'Hola! Quiero hacer una consulta de custom.';
  window.open('https://wa.me/59892906993?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
}

    </form>
  `;

function afterCheckoutRender() {
  const form = document.getElementById('checkout-form');
  if (form) form.addEventListener('submit', onSubmitCheckout);
}
function onSubmitCheckout(e) {
  e.preventDefault();
  const form = e.currentTarget;
  const fd = new FormData(form);
  const name = (fd.get('name') || '').toString().trim();
  const email = (fd.get('email') || '').toString().trim();
  const phone = (fd.get('phone') || '').toString().trim();
  const address = (fd.get('address') || '').toString().trim();
  if (!name || !email || !address) {
    setCheckoutError('Completá nombre, email y dirección de envío.');
    return;
  }
  state.checkoutSubmitting = true;
  setCheckoutError('');
  setCheckoutSubmitLabel();
  fetch('/api/checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name, email, phone, address,
      items: state.cart.map(it => ({ productId: it.productId, size: it.size, qty: it.qty }))
    })
  })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (!ok || !data.init_point) {
        state.checkoutSubmitting = false;
        setCheckoutError((data && data.error) || 'No se pudo iniciar el pago. Probá de nuevo.');
        setCheckoutSubmitLabel();
        return;
      }
      window.location.href = data.init_point;
    })
    .catch(() => {
      state.checkoutSubmitting = false;
      setCheckoutError('Error de conexión. Probá de nuevo.');
      setCheckoutSubmitLabel();
    });
}
function setCheckoutError(msg) {
  state.checkoutError = msg;
  const el = document.getElementById('checkout-error');
  if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
}
function setCheckoutSubmitLabel() {
  const btn = document.getElementById('checkout-submit');
  if (btn) btn.textContent = state.checkoutSubmitting ? 'Procesando…' : 'Pagar con MercadoPago →';
}

  { span: 'auto', row: 'auto', ratio: '4/5' }
];
function renderArchiveDetail() {
  const archives = allArchives();
  const a = archives[state.archIdx] || archives[0];
  const layouts = isMobile() ? ARCHIVE_LAYOUTS_M : ARCHIVE_LAYOUTS_D;
  const photos = (a.photos || []).map((p, j) => {
    const l = layouts[j % layouts.length];
    const label = typeof p === 'string' ? p : p.label;
    const url = typeof p === 'string' ? null : p.url;
    return `
      <div class="archive-photo" style="grid-column:${l.span};${l.row ? 'grid-row:' + l.row + ';' : ''}aspect-ratio:${l.ratio}">
        ${url ? `<img src="${esc(url)}" alt="${esc(label)}">` : `<span class="placeholder-text">[ ${esc(label)} ]</span>`}
      </div>
    `;
  }).join('');
  return `
    <a href="#" class="back" data-action="goArchive">← Archivos</a>
    <div class="archive-detail-head">
      <h1>${esc(a.title)}</h1>
      <span class="credit">${esc(a.credit)}</span>
      <p>${esc(a.desc)}</p>
    </div>
    <div class="archive-detail-grid">${photos}</div>
    ${a.text ? `<div class="archive-detail-text"><p>${esc(a.text)}</p></div>` : ''}
  `;
}

/* ==================== marquee ==================== */
function renderMarquee() {
  const wrap = document.getElementById('marquee-wrap');
  const show = cms.settings ? cms.settings.banner_visible !== false : true;
  if (!show) { wrap.innerHTML = ''; return; }
  const t1 = settingsVal('banner_text_1', 'Envíos a todo el país');
  const t2 = settingsVal('banner_text_2', 'Drop 01');
  const t3 = settingsVal('banner_text_3', 'Montevideo');
  const texts = [t1, t2, t3, t1, t2, t3, t1, t2, t3];
  const spans = texts.map(t => `<span>${esc(t)}</span><span class="sep">✦</span>`).join('');
  wrap.innerHTML = `
    <div class="marquee">
      <div class="marquee-track" id="marquee-track">
        <span class="marquee-content">${spans}</span>
      </div>
    </div>
  `;
}

/* ==================== hero animation ==================== */
let heroRaf = null;
let heroCur = { x: 0, y: 0, p: 0 };
let heroTgt = { x: 0, y: 0, p: 0 };
let heroMouseAttached = false;

function onHeroMove(e) {
  heroTgt.x = (e.clientX / window.innerWidth - .5) * 2;
  heroTgt.y = (e.clientY / window.innerHeight - .5) * 2;
}
function onHeroScroll() {
  heroTgt.p = Math.max(0, Math.min(1, window.scrollY / (window.innerHeight * .42)));
}
function heroEl(id) { return document.getElementById(id); }
function heroLoop() {
  heroRaf = requestAnimationFrame(heroLoop);
  if (state.page !== 'home') return;

  const c = heroCur, t = heroTgt;
  const done = Math.abs(t.x - c.x) < .0005 && Math.abs(t.y - c.y) < .0005 && Math.abs(t.p - c.p) < .0005;
  if (done) return;
  c.x += (t.x - c.x) * .06; c.y += (t.y - c.y) * .06; c.p += (t.p - c.p) * .14;
  const x = c.x, y = c.y, p = c.p;
  const st = (id, prop, v) => { const el = heroEl(id); if (el) el.style[prop] = v; };
  const vw = window.innerWidth / 100, vh = window.innerHeight / 100;
  const mob = isMobile();
  const L = mob ? [[-12,-3],[-6,4],[0,-2],[5,2],[9,-4],[14,3]] : [[-20,-4],[-10,5],[0,-3],[8,2],[15,-6],[24,4]];
  for (let i = 0; i < 6; i++) {
    const ox = L[i][0] * vw * p + x * (3 + i * .6);
    const oy = L[i][1] * vh * p + y * (2 + i * .4);
    st('hero-s' + i, 'transform', 'translate3d(' + ox + 'px,' + oy + 'px,0)');
  }
  const photoO = Math.max(0, Math.min(1, p * 1.6 - .1));
  st('hero-f0', 'transform', 'translate3d(' + (x * -5) + 'px,' + (y * -3) + 'px,0)'); st('hero-f0', 'opacity', photoO);
  st('hero-f1', 'transform', 'translate3d(' + (x * 7) + 'px,' + (y * 5) + 'px,0)'); st('hero-f1', 'opacity', photoO);
  st('hero-f2', 'transform', 'translate3d(' + (x * -4) + 'px,' + (y * 6) + 'px,0)'); st('hero-f2', 'opacity', photoO);
  st('hero-f3', 'transform', 'translate3d(' + (x * 8) + 'px,' + (y * -4) + 'px,0)'); st('hero-f3', 'opacity', photoO);
  st('hero-scr', 'opacity', Math.max(0, 1 - p * 4));
  st('hero-cta', 'opacity', p < .15 ? Math.min(1, (1 - p / .15)) : 0);
}
function initHero() {
  const grain = heroEl('hero-grain');
  if (grain && !grain.style.backgroundImage) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d'), im = ctx.createImageData(128, 128);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255 | 0; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
    ctx.putImageData(im, 0, 0);
    grain.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  }
  if (!heroMouseAttached) {
    if (!isMobile()) window.addEventListener('mousemove', onHeroMove);
    window.addEventListener('scroll', onHeroScroll, { passive: true });
    heroMouseAttached = true;
  }
  if (!heroRaf) heroLoop();
}

let bannerPos = 0;
function bannerLoop() {
  bannerPos -= (isMobile() ? 2.6 : 1);
  const track = document.getElementById('marquee-track');
  if (track) {
    const w = track.scrollWidth / 2;
    if (bannerPos <= -w) bannerPos += w;
    track.style.transform = 'translate3d(' + bannerPos + 'px,0,0)';
  }
  requestAnimationFrame(bannerLoop);
}

/* ==================== event delegation ==================== */
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');
  if (target.tagName === 'A' || target.tagName === 'BUTTON') e.preventDefault();

  switch (action) {
    case 'toggleMenu': state.menuOpen = !state.menuOpen; syncMenu(); break;
    case 'closeMenu': state.menuOpen = false; syncMenu(); break;
    case 'goHome': state.menuOpen = false; syncMenu(); goTo('home'); break;
    case 'goShop': state.menuOpen = false; syncMenu(); goTo('shop'); break;
    case 'goArchive': state.menuOpen = false; syncMenu(); goTo('archive'); break;
    case 'goCustom': state.menuOpen = false; syncMenu(); goTo('custom'); break;
    case 'goAbout': state.menuOpen = false; syncMenu(); goTo('about'); break;
    case 'goUnicos': goTo('shop', { cat: 'ÚNICOS', shopIdx: 0 }); break;
    case 'goCheckout':
      if (!state.cart.length) return;
      state.cartOpen = false; syncCartDrawer();
      goTo('checkout');
      break;
    case 'openCart': openCart(); break;
    case 'closeCart': closeCart(); break;
    case 'openProduct': goTo('product', { prodIdx: Number(target.getAttribute('data-idx')) }); break;
    case 'openArchive': goTo('archiveDetail', { archIdx: Number(target.getAttribute('data-idx')) }); break;
    case 'pickCat':
      state.cat = target.getAttribute('data-cat');
      state.shopIdx = 0;
      renderPage(); afterShopRender();
      break;
    case 'pickCarouselItem': {
      const i = Number(target.getAttribute('data-i'));
      if (i === state.shopIdx) {
        const filtered = shopFiltered();
        const p = filtered[i];
        if (p) goTo('product', { prodIdx: allProducts().indexOf(p) });
      } else {
        state.shopIdx = i;
        updateShopSelection();
      }
      break;
    }
    case 'shopPrev': {
      if (state.shopIdx > 0) { state.shopIdx -= 1; updateShopSelection(); }
      break;
    }
    case 'shopNext': {
      const filtered = shopFiltered();
      if (state.shopIdx < filtered.length - 1) { state.shopIdx += 1; updateShopSelection(); }
      break;
    }
    case 'toggleAccordion': {
      const key = target.getAttribute('data-key');
      state.accOpen = state.accOpen === key ? null : key;
      updateAccordion();
      break;
    }
    case 'pickSize': {
      state.selSize = target.getAttribute('data-size');
      updateSizeButtons();
      break;
    }
    case 'qtyInc': state.qty += 1; updateQty(); break;
    case 'qtyDec': if (state.qty > 1) { state.qty -= 1; updateQty(); } break;
    case 'addToCart': {
      const all = allProducts();
      const raw = all[state.prodIdx] || all[0];
      addToCart(decorate(raw, all));
      break;
    }
    case 'cartInc': mutateCartQty(Number(target.getAttribute('data-i')), 1); break;
    case 'cartDec': mutateCartQty(Number(target.getAttribute('data-i')), -1); break;
    case 'cartRemove': removeCartItem(Number(target.getAttribute('data-i'))); break;
  }
});

function syncMenu() {
  document.getElementById('mobile-menu').classList.toggle('is-open', state.menuOpen);
  document.getElementById('mobile-menu-overlay').classList.toggle('is-open', state.menuOpen);
}
function updateAccordion() {
  document.querySelectorAll('#accordion .accordion-row').forEach(row => {
    const open = row.getAttribute('data-key') === state.accOpen;
    row.classList.toggle('is-open', open);
    const sign = row.querySelector('.sign');
    if (sign) sign.textContent = open ? '−' : '+';
  });
}
function updateSizeButtons() {
  document.querySelectorAll('#size-grid .size-btn').forEach(btn => {
    btn.classList.toggle('is-selected', btn.getAttribute('data-size') === state.selSize);
  });
}
function updateQty() {
  const el = document.getElementById('qty-value');
  if (el) el.textContent = state.qty;
}

window.addEventListener('resize', () => {
  if (state.page === 'shop') updateShopSelection();
});

/* ==================== boot ==================== */
function boot() {
  if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  setTimeout(() => document.getElementById('loader').classList.add('is-fading'), 1300);
  setTimeout(() => document.getElementById('loader').classList.add('is-done'), 1950);

  renderMarquee();
  renderPage();
  updateHeader();
  requestAnimationFrame(bannerLoop);

  try {
    const params = new URLSearchParams(window.location.search);
    const orderParam = params.get('order');
    if (orderParam === 'success' || orderParam === 'pending' || orderParam === 'failure') {
      state.page = 'orderStatus';
      state.orderStatus = orderParam;
      state.orderRef = params.get('ref') || '';
      if (orderParam === 'success') { state.cart = []; saveCart(); }
      renderPage();
      updateHeader();
      window.history.replaceState(null, '', window.location.pathname);
    }
  } catch (e) {}

  fetch('/api/content').then(r => r.json()).then(d => {
    cms.settings = d.settings; cms.categories = d.categories; cms.customFields = d.customFields;
    renderMarquee();
    if (state.page === 'home') { refreshHomeCms(); }
    else renderPage();
    updateHeader();
  }).catch(() => {});
  fetch('/api/products').then(r => r.json()).then(d => {
    cms.products = d;
    if (state.page === 'home') refreshHomeCms();
    else if (state.page === 'shop') { renderPage(); afterShopRender(); }
  }).catch(() => {});
  fetch('/api/archives').then(r => r.json()).then(d => {
    cms.archives = d;
    if (state.page === 'archive' || state.page === 'archiveDetail') renderPage();
  }).catch(() => {});
}

function refreshHomeCms() {
  const all = allProducts();
  const featured = (all.filter(p => p.featured).length ? all.filter(p => p.featured) : [all[0], all[1], all[6]].filter(Boolean)).slice(0, 3).map(p => decorate(p, all));
  const unicos = all.filter(p => p.unique).slice(0, 2).map(p => decorate(p, all));
  const dropGrid = document.getElementById('drop-grid');
  if (dropGrid) dropGrid.innerHTML = featured.map(p => `
    <button class="product-card" data-action="openProduct" data-idx="${p.idx}">
      ${p.image1
        ? `<div class="media-box"><img src="${esc(p.image1)}" alt="${esc(p.name)}">${p.tag ? `<span class="card-tag">${esc(p.tag)}</span>` : ''}</div>`
        : `<div class="media-box"><span class="placeholder-text">[ ${esc(p.placeholder)} ]</span>${p.tag ? `<span class="card-tag">${esc(p.tag)}</span>` : ''}</div>`}
      <div class="card-info"><span>${esc(p.name)}</span><span>${esc(p.price)}</span></div>
    </button>
  `).join('');
  const unicosGrid = document.getElementById('unicos-grid');
  if (unicosGrid) unicosGrid.innerHTML = unicos.map(p => mediaBox(p.image1, p.name, p.placeholder)).join('');
  const galleryImg = document.getElementById('gallery-fixed-img');
  if (galleryImg) galleryImg.src = settingsVal('gallery_image_url', 'assets/hero-modelo1.jpg');
  const galleryBrand = document.getElementById('gallery-brand');
  if (galleryBrand) galleryBrand.textContent = settingsVal('gallery_brand_text', 'Benji$');
  const gallerySub = document.getElementById('gallery-sub');
  if (gallerySub) gallerySub.textContent = settingsVal('gallery_subtitle_text', 'Montevideo — Uruguay');
  const ctaTitle = document.getElementById('cta-title');
  if (ctaTitle) ctaTitle.textContent = settingsVal('cta_title', '¿Tenés una idea?');
  const ctaText = document.getElementById('cta-text');
  if (ctaText) ctaText.textContent = settingsVal('cta_paragraph', 'Trabajamos prendas y piezas personalizadas. Contanos qué estás buscando y lo armamos juntos.');
  const ctaBtn = document.getElementById('cta-btn');
  if (ctaBtn) ctaBtn.textContent = settingsVal('cta_button_text', 'Enviar consulta →');
}

boot();
</script>
